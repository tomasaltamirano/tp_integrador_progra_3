<!doctype html>
<html lang="es" data-theme="dark">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Modificar Producto - UTN Videogames</title>
		<link rel="stylesheet" href="./css/styles.css" />
		<link rel="stylesheet" href="./css/admin.css" />
	</head>
	<body class="body-carrito">
		<header>
			<div class="kiosco-info">
				<h1>Panel de Administración</h1>
				<p class="alumnos">Modificar Producto</p>
			</div>
			<div class="header-actions">
				<a href="admin-dashboard.html" class="btn-admin">👁️ Ver Todos</a>
				<a href="admin-post.html" class="btn-admin">➕ Crear</a>
				<a
					href="admin-put.html"
					class="btn-admin"
					style="border: 2px solid white;"
					>✏️ Modificar</a
				>
				<a href="admin-delete.html" class="btn-admin">🗑️ Eliminar</a>
				<button class="btn-theme" onclick="toggleTheme()">🌓 Tema</button>
				<a
					href="index.html"
					class="btn-admin"
					style="background-color: #8b0000;"
					>Salir</a
				>
			</div>
		</header>

		<div
			class="cart-container admin-container"
			style="max-width: 600px; margin-top: 20px;">
			<div class="cart-header">
				<h2>Modificar Videojuego</h2>
			</div>

			<div class="cart-layout" style="display: block;">
				<div id="contenedor-mensajes"></div>

				<!-- Buscar por ID -->
				<form
					id="buscarProducto-form"
					style="display: flex; gap: 10px; align-items: flex-end; margin-bottom: 20px;">
					<div style="flex: 1;">
						<label
							for="idBuscar"
							style="font-weight: bold; display: block; margin-bottom: 6px;"
							>ID del producto a modificar:</label
						>
						<input
							type="number"
							id="idBuscar"
							class="input-kiosco"
							placeholder="Ej: 3"
							required
							style="margin: 0; width: 100%;" />
					</div>
					<button
						type="submit"
						class="btn-comenzar"
						style="width: auto; padding: 1rem 2rem; font-size: 1rem;">
						Buscar
					</button>
				</form>

				<!-- Form de edición (oculto hasta buscar) -->
				<form
					id="updateProduct-form"
					style="display: none; flex-direction: column; gap: 15px;">
					<input type="hidden" id="idProducto" name="id" />

					<label for="nombreProd" style="font-weight: bold;"
						>Nombre del Juego:</label
					>
					<input
						type="text"
						name="nombre"
						id="nombreProd"
						class="input-kiosco"
						required />

					<label for="imagenProd" style="font-weight: bold;"
						>URL de la Imagen:</label
					>
					<input
						type="url"
						name="imagen"
						id="imagenProd"
						class="input-kiosco"
						required />

					<label for="descProd" style="font-weight: bold;"
						>Descripción (Etiqueta):</label
					>
					<input
						type="text"
						name="descripcion"
						id="descProd"
						class="input-kiosco" />

					<label for="categoriaProd" style="font-weight: bold;"
						>Categoría:</label
					>
					<select
						name="categoria"
						id="categoriaProd"
						class="input-kiosco"
						style="cursor: pointer;">
						<option value="fisico">Juego Físico</option>
						<option value="digital">Juego Digital</option>
					</select>

					<label for="precioProd" style="font-weight: bold;"
						>Precio (US$):</label
					>
					<input
						type="number"
						step="0.01"
						name="precio"
						id="precioProd"
						class="input-kiosco"
						required />

					<label for="activoProd" style="font-weight: bold;">Estado:</label>
					<select
						name="activo"
						id="activoProd"
						class="input-kiosco"
						style="cursor: pointer;">
						<option value="1">✅ Activo</option>
						<option value="0">❌ Inactivo</option>
					</select>

					<button
						type="submit"
						class="btn-comenzar"
						style="margin-top: 15px; width: 100%;">
						GUARDAR CAMBIOS
					</button>
				</form>
			</div>
		</div>

		<script>
			const urlBase = "http://localhost:3000/api/productos";
			const contenedorMensajes = document.getElementById("contenedor-mensajes");
			const updateForm = document.getElementById("updateProduct-form");

			function mostrarMensaje(tipo, mensaje) {
			    const color = tipo === 'exito' ? '#4ade80' : '#ff6b6b';
			    const bgColor = tipo === 'exito' ? 'rgba(74, 222, 128, 0.1)' : 'rgba(255, 107, 107, 0.1)';
			    contenedorMensajes.innerHTML = `
			        <div style="background-color: ${bgColor}; border: 1px solid ${color}; color: ${color}; padding: 15px; border-radius: 8px; text-align: center; margin-bottom: 20px;">
			            ${mensaje}
			        </div>
			    `;
			    if (tipo === 'exito') setTimeout(() => { contenedorMensajes.innerHTML = ''; }, 3000);
			}

			// Buscar producto por ID y precargar el form
			document.getElementById("buscarProducto-form").addEventListener("submit", async event => {
			    event.preventDefault();
			    const id = document.getElementById("idBuscar").value.trim();

			    try {
			        const response = await fetch(`${urlBase}/${id}`);
			        const data = await response.json();

			        if (!response.ok) {
			            mostrarMensaje("error", data.error || "Producto no encontrado.");
			            updateForm.style.display = "none";
			            return;
			        }

			        const p = data.payload;
			        contenedorMensajes.innerHTML = "";

			        // Precargamos los valores en el form
			        document.getElementById("idProducto").value = p.id;
			        document.getElementById("nombreProd").value = p.nombre;
			        document.getElementById("imagenProd").value = p.imagen;
			        document.getElementById("descProd").value = p.descripcion || "";
			        document.getElementById("categoriaProd").value = p.categoria;
			        document.getElementById("precioProd").value = p.precio;
			        document.getElementById("activoProd").value = p.activo ? "1" : "0";

			        updateForm.style.display = "flex";

			    } catch (error) {
			        mostrarMensaje("error", "Error de conexión con el servidor.");
			    }
			});

			// Enviar los cambios
			updateForm.addEventListener("submit", async event => {
			    event.preventDefault();
			    const formData = new FormData(event.target);
			    const data = Object.fromEntries(formData.entries());
			    data.precio = Number(data.precio);
			    data.activo = Number(data.activo);

			    try {
			        const response = await fetch(`${urlBase}/${data.id}`, {
			            method: "PUT",
			            headers: { "Content-Type": "application/json" },
			            body: JSON.stringify(data)
			        });

			        const result = await response.json();

			        if (!response.ok) {
			            mostrarMensaje("error", result.error || "Error al actualizar el producto.");
			            return;
			        }

			        mostrarMensaje("exito", "¡Producto actualizado con éxito!");
			        updateForm.style.display = "none";
			        document.getElementById("buscarProducto-form").reset();

			    } catch (error) {
			        mostrarMensaje("error", "Error de conexión con el servidor.");
			    }
			});
		</script>
		<script src="./js/index.js"></script>
	</body>
</html>
