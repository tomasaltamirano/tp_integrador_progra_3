<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eliminar Producto - UTN Videogames</title>
    <link rel="stylesheet" href="./css/styles.css">
    <link rel="stylesheet" href="./css/admin.css">
</head>
<body class="body-carrito">

    <header>
        <div class="kiosco-info">
            <h1>Panel de Administración</h1>
            <p class="alumnos">Eliminar Producto</p>
        </div>
        <div class="header-actions">
            <a href="admin-dashboard.html" class="btn-admin">👁️ Ver Todos</a>
            <a href="admin-post.html" class="btn-admin">➕ Crear</a>
            <a href="admin-put.html" class="btn-admin">✏️ Modificar</a>
            <a href="admin-delete.html" class="btn-admin" style="border: 2px solid white;">🗑️ Eliminar</a>
            <a href="index.html" class="btn-admin" style="background-color: #8b0000;">Salir</a>
        </div>
    </header>

    <div class="cart-container admin-container" style="max-width: 600px;">
        <div class="cart-header">
            <h2>Eliminar Videojuego</h2>
        </div>

        <div class="cart-layout" style="display: block;">

            <div id="contenedor-mensajes"></div>

            <!-- Buscar por ID -->
            <form id="buscarProducto-form" style="display: flex; gap: 10px; align-items: flex-end; margin-bottom: 20px;">
                <div style="flex: 1;">
                    <label for="idBuscar" style="font-weight: bold; display: block; margin-bottom: 6px;">ID del producto a eliminar:</label>
                    <input type="number" id="idBuscar" class="input-kiosco" placeholder="Ej: 3" required style="margin: 0; width: 100%;">
                </div>
                <button type="submit" class="btn-comenzar" style="width: auto; padding: 1rem 2rem; font-size: 1rem;">Buscar</button>
            </form>

            <!-- Producto encontrado -->
            <div id="contenedor-producto" style="display: none;">
                <div id="producto-preview" class="cart-item" style="justify-content: flex-start; gap: 20px; margin-bottom: 20px;"></div>
                <button id="btn-eliminar" class="btn-comenzar" style="background-color: #8b0000; width: 100%;">🗑️ Eliminar Producto</button>
            </div>

        </div>
    </div>

    <script>
        const urlBase = "http://localhost:3000/api/productos";
        const contenedorMensajes = document.getElementById("contenedor-mensajes");
        const contenedorProducto = document.getElementById("contenedor-producto");
        let productoActual = null;

        function mostrarMensaje(tipo, mensaje) {
            const color = tipo === 'exito' ? '#4ade80' : '#ff6b6b';
            const bgColor = tipo === 'exito' ? 'rgba(74, 222, 128, 0.1)' : 'rgba(255, 107, 107, 0.1)';
            contenedorMensajes.innerHTML = `
                <div style="background-color: ${bgColor}; border: 1px solid ${color}; color: ${color}; padding: 15px; border-radius: 8px; text-align: center; margin-bottom: 20px;">
                    ${mensaje}
                </div>
            `;
            if (tipo === 'exito') setTimeout(() => { contenedorMensajes.innerHTML = ''; }, 3000);
        }

        // Buscar producto por ID
        document.getElementById("buscarProducto-form").addEventListener("submit", async event => {
            event.preventDefault();
            const id = document.getElementById("idBuscar").value.trim();

            try {
                const response = await fetch(`${urlBase}/${id}`);
                const data = await response.json();

                if (!response.ok) {
                    mostrarMensaje("error", data.error || "Producto no encontrado.");
                    contenedorProducto.style.display = "none";
                    return;
                }

                productoActual = data.payload;
                contenedorMensajes.innerHTML = "";

                document.getElementById("producto-preview").innerHTML = `
                    <img src="${productoActual.imagen}" alt="${productoActual.nombre}" style="width: 80px; height: 80px; object-fit: cover; border-radius: 8px; flex-shrink: 0;">
                    <div class="item-details" style="flex-grow: 1;">
                        <h4>${productoActual.nombre}</h4>
                        <span class="item-badge">${productoActual.categoria}</span>
                        <p style="font-size: 12px; color: #aaa; margin-top: 5px;">ID en Base de Datos: <strong>${productoActual.id}</strong></p>
                    </div>
                    <div class="item-price-col">
                        ${productoActual.activo ? '<span style="color: #4ade80;">✅ Activo</span>' : '<span style="color: #ff6b6b;">❌ Inactivo</span>'}
                        <p class="item-price">US$ ${productoActual.precio}</p>
                    </div>
                `;

                contenedorProducto.style.display = "block";

            } catch (error) {
                mostrarMensaje("error", "Error de conexión con el servidor.");
            }
        });

        // Eliminar con confirm() como el profe
        document.getElementById("btn-eliminar").addEventListener("click", async () => {
            if (!productoActual) return;

            const confirmacion = confirm(`¿Querés eliminar "${productoActual.nombre}"?`);
            if (!confirmacion) return;

            try {
                const response = await fetch(`${urlBase}/${productoActual.id}`, {
                    method: "DELETE"
                });

                const result = await response.json();

                if (!response.ok) {
                    mostrarMensaje("error", result.error || "Error al eliminar el producto.");
                    return;
                }

                mostrarMensaje("exito", `¡Producto "${productoActual.nombre}" eliminado con éxito!`);
                contenedorProducto.style.display = "none";
                document.getElementById("buscarProducto-form").reset();
                productoActual = null;

            } catch (error) {
                mostrarMensaje("error", "Error de conexión con el servidor.");
            }
        });
    </script>
</body>
</html>
