<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pantalla Inicio Login</title>
    <link rel="stylesheet" href="./css/styles.css">
</head>
<body>

    <header>
        <div class="kiosco-info">
            <h1>UTN Videogames Store</h1>
            <p class="alumnos">Desarrollo: Leandro Diaz y Tomás Altamirano</p>
        </div>
        <div class="header-actions">
            <a href="admin-login.html" class="btn-admin">⚙️ Admin</a>
            <button class="btn-theme" onclick="toggleTheme()">🌓 Tema</button>
        </div>
    </header>

    <div class="bienvenida-wrapper">
        <div class="bienvenida-card">
            <h2>Bienvenido a UTN Videogames Store!</h2>
            <p>Ingresa tu nombre para tu ticket de compra</p>
            
            <input type="text" class="input-kiosco" placeholder="Tu nombre aquí..." id="nombreUsuario">
            
            <a href="productos.html" id="btnComenzar"><button class="btn-comenzar">COMENZAR PEDIDO</button></a>
        </div>
    </div>

    <script src="./js/index.js"></script>
</body>
</html>
