<!doctype html>
<html lang="es" data-theme="light">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Pantalla Productos</title>
		<link rel="stylesheet" href="./css/styles.css" />
	</head>
	<body>
		<header>
			<div class="kiosco-info">
				<h1>UTN Videogames Store</h1>
				<p class="alumnos">Desarrollo: Leandro Diaz y Tomás Altamirano</p>
			</div>
			<div class="header-actions">
				<a
					href="./index.html"
					class="btn-admin"
					style="color: var(--accent-color);"
					>❌ Cancelar Pedido</a
				>
				<button class="btn-theme" onclick="toggleTheme()">🌓 Tema</button>
			</div>
		</header>

		<main class="main-kiosco">
			<div class="categorias-kiosco">
				<button
					class="btn-categoria activa"
					onclick="cambiarCategoria('fisico', this)">
					JUEGOS FISICOS
				</button>

				<button
					class="btn-categoria"
					onclick="cambiarCategoria('digital', this)">
					JUEGOS DIGITALES
				</button>
			</div>

			<div class="grilla-kiosco" id="grilla-kiosco">
				<!-- carga dinamica papu -->
			</div>
		</main>

		<div class="barra-carrito">
			<div class="info-pedido">
				<h3>🛒 Mi Pedido: 0 items</h3>
				<p>Total: US$ 0.00</p>
			</div>
			<a href="carrito.html" class="btn-pagar">VER PEDIDO ➔</a>
		</div>

		<script src="./js/index.js"></script>
		<script src="./js/productos.js"></script>
	</body>
</html>
