<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Administrador - UTN Videogames</title>
    <link rel="stylesheet" href="./css/styles.css">
</head>
<body>

    <header>
        <div class="kiosco-info">
            <h1>UTN Videogames Store</h1>
            <p class="alumnos">Panel de Administración</p>
        </div>
        <div class="header-actions">
            <a href="index.html" class="btn-admin">🏠 Volver a la Tienda</a>
            <button class="btn-theme" onclick="toggleTheme()">🌓 Tema</button>
        </div>
    </header>

    <div class="bienvenida-wrapper">
        <div class="bienvenida-card">
            <h2>Acceso Restringido</h2>
            <p>Ingresa tus credenciales de administrador</p>
            
            <form action="admin-dashboard.html" method="GET" style="display: flex; flex-direction: column; gap: 15px; margin-top: 20px;">
                
                <input type="email" class="input-kiosco" placeholder="Correo electrónico" required>
                <input type="password" class="input-kiosco" placeholder="Contraseña" required>
                
                <button type="button" class="btn-comenzar" style="background-color: #555;" onclick="autocompletarLogin()">⚡ Acceso Rápido Profes</button>
                
                <button type="submit" class="btn-comenzar">INGRESAR</button>
            </form>
        </div>
    </div>

    <script src="./js/index.js"></script>
    <script>
        // Función sencilla para el acceso rápido que pide el TP
        function autocompletarLogin() {
            const inputs = document.querySelectorAll('.input-kiosco');
            inputs[0].value = "profesor@utn.edu.ar";
            inputs[1].value = "admin123";
        }
    </script>
</body>
</html>
